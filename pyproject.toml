[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramos-planejados"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=3.1,<5.0",
  "psycopg2-binary>=2.9",
  "slowapi>=0.1.9",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure logic tests, no DB or HTTP",
  "integration: real test database and HTTP client",
  "security: adversarial scenarios",
]
addopts = "--cov=src --cov-report=term-missing"
