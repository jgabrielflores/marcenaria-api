[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramos-planejados"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  # Pin bcrypt <4.1: passlib 1.7.4 reads bcrypt.__about__.__version__, removed in
  # bcrypt 4.1+. Newer bcrypt breaks passlib's backend detection (ValueError on hash).
  "bcrypt>=4.0,<4.1",
  "psycopg2-binary>=2.9",
  "slowapi>=0.1.9",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure logic tests, no DB or HTTP",
  "integration: real test database and HTTP client",
  "security: adversarial scenarios",
]
addopts = "--cov=src --cov-report=term-missing --cov-branch"

[tool.coverage.run]
# Excluded: pydantic-settings boilerplate is validated by the framework, not us.
# The seed script IS now covered (tests/integration/test_seed_admin.py) — it runs
# in production at boot, so it earns a regression test.
omit = [
  "src/config.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
  # FastAPI dependency injection idiom: Depends(...) in argument defaults is intentional.
  "B008",
  # UP042 (enum.StrEnum migration) deferred — changing enum base is a separate task.
  "UP042",
]

[tool.mypy]
python_version = "3.11"
# pydantic plugin teaches mypy that BaseSettings fields are populated from the env,
# so Settings() with no args is valid.
plugins = ["pydantic.mypy"]
# Permissive baseline — tighten over time (see Fase 4 of the deploy plan).
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]
